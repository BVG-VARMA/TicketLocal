version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketlocal_postgres
    environment:
      POSTGRES_USER: ticketlocal
      POSTGRES_PASSWORD: ticketlocal_secret
      POSTGRES_DB: ticketlocal_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketlocal -d ticketlocal_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ticketlocal_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --timeout 0
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
